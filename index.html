<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>ovo 数独 💕</title>
<style>
:root{--bg:#FFF0F5;--card:#fff;--text:#8B3A62;--accent:#FF7BAC;--line:#caa;--alt:#FFE4EC;--muted:#B07A96;}
body.dark{--bg:#1E1E2F;--card:#252536;--text:#E8E8F0;--accent:#FF7BAC;--line:#555;--alt:#2E2E42;--muted:#888;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 10px calc(env(safe-area-inset-bottom) + 70px);min-height:100dvh;}
h1{font-size:22px;margin:4px 0;}
.sub{font-size:12px;color:var(--muted);margin-bottom:4px;}
.bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0;}
button,select{font:inherit;}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;}
select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);}
#board{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;width:min(94vw,420px);aspect-ratio:1/1;background:var(--line);border:3px solid var(--line);border-radius:10px;overflow:hidden;flex-shrink:0;}
.c{background:var(--card);display:flex;align-items:center;justify-content:center;font-size:clamp(18px,6vw,26px);font-weight:800;color:var(--text);aspect-ratio:1/1;cursor:pointer;position:relative;}
.c.alt{background:var(--alt);}
.c.given{color:var(--text);}
.c.sel{background:#FFD1DC !important;box-shadow:inset 0 0 0 2px var(--accent);}
.c.hl{background:#FFE8F0;}
.c.err{color:#FF4D6D;}
.c.tr{border-right:2px solid var(--line);}
.c.br{border-right:2px solid var(--line);}
.c.tb{border-bottom:2px solid var(--line);}
.c.bb{border-bottom:2px solid var(--line);}
#status{margin-top:8px;font-size:13px;color:var(--accent);min-height:18px;text-align:center;}
#best{font-size:12px;color:var(--muted);margin-top:2px;}
#timer{font-size:13px;color:var(--muted);margin:4px 0;}
#numpad{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 10px);left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(94vw,420px);z-index:10;}
#numpad button{padding:12px 0;font-size:20px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-weight:800;}
#numpad #erase{background:var(--alt);color:var(--text);}
</style>
</head>
<body>
<h1>ovo 数独 💕</h1>
<div class="sub">笨蛋ovo 🐾</div>
<div class="bar">
  <select id="diff"><option value="35">幼儿园</option><option value="45">小学生</option><option value="55" selected>大魔王</option></select>
  <button onclick="newGame()">新游戏</button>
  <button id="hintBtn" onclick="hintCell()">💡提示 (3)</button>
  <button onclick="check()">✓检查</button>
  <button id="themeBtn" onclick="toggleTheme()">🌙 深色</button>
  <button onclick="clearSave()">🗑清记录</button>
</div>
<div id="timer">⏱ 00:00</div>
<div id="board"></div>
<div id="status">ovo～</div>
<div id="best">最佳：暂无</div>
<div id="numpad">
  <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button>
  <button data-n="6">6</button><button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button><button id="erase">⌫</button>
</div>

<script>
const KEY="ovo_sudoku_save_v2";
let puzzle=[],solution=[],given=[],seconds=0,tid=null,sel=null,hints=3,finished=false;
const board=document.getElementById('board'),hintBtn=document.getElementById('hintBtn');

function saveState(){try{localStorage.setItem(KEY,JSON.stringify({puzzle,solution,given,seconds,hints,diff:+document.getElementById('diff').value,ts:Date.now(),finished}));}catch(e){}}
function loadState(){try{const s=localStorage.getItem(KEY);if(!s)return false;const d=JSON.parse(s);if(!d.puzzle||d.puzzle.length!==9)return false;puzzle=d.puzzle;solution=d.solution;given=d.given;seconds=d.seconds||0;hints=d.hints??3;finished=d.finished||false;document.getElementById('diff').value=String(d.diff||55);return true;}catch(e){return false;}}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function valid(g,r,c,n){for(let i=0;i<9;i++)if(g[r][i]===n||g[i][c]===n)return false;let br=r-r%3,bc=c-c%3;for(let i=0;i<3;i++)for(let j=0;j<3;j++)if(g[br+i][bc+j]===n)return false;return true;}
function solve(g){for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(g[r][c]===0){for(let n of shuffle([1,2,3,4,5,6,7,8,9])){if(valid(g,r,c,n)){g[r][c]=n;if(solve(g))return true;g[r][c]=0;}}return false;}return true;}

function newGame(){
  const holes=+document.getElementById('diff').value;
  solution=Array.from({length:9},()=>Array(9).fill(0));solve(solution);
  puzzle=solution.map(r=>r.slice());given=solution.map(r=>r.map(()=>true));
  let cells=shuffle([...Array(81).keys()]),removed=0;
  for(let id of cells){if(removed>=holes)break;let r=Math.floor(id/9),c=id%9;puzzle[r][c]=0;given[r][c]=false;removed++;}
  hints=3;finished=false;seconds=0;sel=null;hintBtn.textContent='💡提示 (3)';hintBtn.disabled=false;
  startTimer();render();saveState();setStatus('游戏开始');
}

function render(){
  board.innerHTML='';
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const d=document.createElement('div');
    d.className='c '+(((r/3|0)+(c/3|0))%2?'alt':'')+(given[r][c]?' given':'')+(sel&&sel.r===r&&sel.c===c?' sel':'')+(sel&&(sel.r===r||sel.c===c||(Math.floor(sel.r/3)===Math.floor(r/3)&&Math.floor(sel.c/3)===Math.floor(c/3)))&&!(sel.r===r&&sel.c===c)?' hl':'');
    if(c===2||c===5)d.classList.add('tr');if(r===2||r===5)d.classList.add('tb');if(c===8)d.classList.add('br');if(r===8)d.classList.add('bb');
    d.textContent=puzzle[r][c]||'';
    if(!given[r][c]&&puzzle[r][c]&&puzzle[r][c]!==solution[r][c])d.classList.add('err');
    d.addEventListener('click',()=>{if(given[r][c]){sel=null;}else sel={r,c};render();});
    board.appendChild(d);
  }
  document.getElementById('timer').textContent='⏱ '+fmt(seconds);
}

function place(n){
  if(!sel||given[sel.r][sel.c]||finished)return;
  puzzle[sel.r][sel.c]=n;sel=null;render();saveState();
  if(!finished&&isComplete()){stopTimer();setStatus('🎉 完成！用时 '+fmt(seconds));saveBest();finished=true;}
}
function hintCell(){if(finished||hints<=0)return;for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(!given[r][c]&&puzzle[r][c]!==solution[r][c]){puzzle[r][c]=solution[r][c];given[r][c]=true;hints--;hintBtn.textContent='💡提示 ('+hints+')';if(hints<=0)hintBtn.disabled=true;sel=null;render();saveState();setStatus('ovo 给你提示啦 💡');if(isComplete()){stopTimer();setStatus('🎉 完成！用时 '+fmt(seconds));saveBest();finished=true;}return;}setStatus('没有可提示的格子哦');}
function check(){if(finished)return;for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(puzzle[r][c]!==solution[r][c]){setStatus('❌ 还有错，再看看');return;}stopTimer();setStatus('🎉 完成！用时 '+fmt(seconds));saveBest();finished=true;}
function toggleTheme(){document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');document.getElementById('themeBtn').textContent=dark?'🌸 粉色':'🌙 深色';try{localStorage.setItem('ovo_theme',dark?'dark':'pink');}catch(e){}}
function clearSave(){try{localStorage.removeItem(KEY);}catch(e){}newGame();}
function setStatus(t){document.getElementById('status').textContent=t;}
function isComplete(){for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(puzzle[r][c]!==solution[r][c])return false;return true;}
function fmt(s){return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function startTimer(){stopTimer();tid=setInterval(()=>{seconds++;document.getElementById('timer').textContent='⏱ '+fmt(seconds);saveState();},1000);}
function stopTimer(){if(tid)clearInterval(tid);}
function diffName(){const v=document.getElementById('diff').value;return v==='35'?'幼儿园':v==='45'?'小学生':'大魔王';}
function saveBest(){try{const k='ovo_best_'+diffName();const old=localStorage.getItem(k);if(!old||seconds<+old)localStorage.setItem(k,seconds);loadBest();}catch(e){}}
function loadBest(){try{const v=localStorage.getItem('ovo_best_'+diffName());document.getElementById('best').textContent='最佳（'+diffName()+'）：'+(v?fmt(+v):'暂无');}catch(e){}}

document.getElementById('diff').addEventListener('change',()=>{loadBest();newGame();});
document.getElementById('erase').addEventListener('click',()=>place(0));
document.querySelectorAll('#numpad button[data-n]').forEach(b=>b.addEventListener('click',()=>place(+b.dataset.n)));
try{if(localStorage.getItem('ovo_theme')==='dark'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='🌸 粉色';}}catch(e){}
loadBest();
if(loadState()){render();setStatus('欢迎回来～接着玩');hintBtn.textContent='💡提示 ('+hints+')';hintBtn.disabled=hints<=0;if(!finished)startTimer();}
else newGame();
</script>
</body>
</html>
